<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knowledge Base App</title>
  <link rel="icon" href="/favicon.png" sizes="any">
  
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

  <style>
    body {
      min-height: 100vh;
      margin: 0;
      background: radial-gradient(circle at 50% 50%, #0a58ca 0%, #031b4e 65%, #010a1c 100%);
      color: #ffffff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    /* 1. LOADING SCREEN */
    .loading-screen {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .glow-spinner {
      width: 80px;
      height: 80px;
      border: 4px solid rgba(255, 255, 255, 0.15);
      border-top: 4px solid #38edf6;
      border-right: 4px solid #0d6efd;
      border-radius: 50%;
      animation: spin 1.2s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
      box-shadow: 0 0 30px rgba(56, 237, 246, 0.35);
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .sync-text {
      margin-top: 1.5rem;
      font-size: 1.1rem;
      color: #cbd5e1;
      letter-spacing: 0.5px;
    }

    /* 2. FLOATING MUSIC WIDGET (Top Right) */
    .music-widget {
      position: fixed;
      top: 25px;
      right: 35px;
      z-index: 1000;
      display: none; /* Controlled by JS after 3.5s */
    }

    .music-btn {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #ffffff;
      padding: 0.5rem 1.1rem;
      border-radius: 30px;
      font-size: 0.9rem;
      font-weight: 500;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .music-btn:hover {
      background: rgba(255, 255, 255, 0.25);
      border-color: #38edf6;
      box-shadow: 0 0 15px rgba(56, 237, 246, 0.4);
      transform: translateY(-2px);
    }

    /* 3. MAIN APP SCREEN */
    .main-wrapper {
      min-height: 100vh;
      display: none; /* Revealed after 3.5s */
      flex-direction: column;
      justify-content: space-between;
      padding: 3rem 4rem;
      animation: fadeIn 0.6s ease-in-out forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }

    .content-area {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-grow: 1;
      width: 100%;
    }

    .header-section h1 {
      font-size: 2.8rem;
      font-weight: 600;
      margin-bottom: 0.3rem;
    }

    .header-section p {
      color: #cbd5e1;
      font-size: 1.3rem;
      font-weight: 300;
    }

    .input-section {
      width: 280px;
    }

    .custom-input {
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      font-size: 1rem;
      color: #1e293b;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      transition: all 0.3s ease;
    }

    .custom-input:focus {
      outline: none;
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(56, 237, 246, 0.4);
      border-color: #38edf6;
    }

    .footer-text {
      text-align: center;
      font-size: 0.75rem;
      letter-spacing: 2px;
      color: #64748b;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <!-- FIRST: Loading Screen -->
  <div class="loading-screen" id="loadingScreen">
    <div class="glow-spinner"></div>
    <div class="sync-text">Synchronizing... Retrieving user data</div>
  </div>

  <!-- FLOATING MUSIC TOGGLE BUTTON -->
  <div class="music-widget" id="musicWidget">
    <button id="musicToggleBtn" class="music-btn d-flex align-items-center gap-2">
      <span id="musicIcon">🎵</span>
      <span id="musicText">Play Study Music</span>
    </button>
    <!-- Background Lo-Fi Royalty Free Audio Track -->
    <audio id="bgMusic" loop src="/study-song.mp3"></audio>
  </div>

  <!-- SECOND: Main App UI -->
  <div class="main-wrapper" id="mainApp">
    <div class="content-area">
      
      <!-- Left side text -->
      <div class="header-section">
        <h1 id="welcomeHeading">Welcome New User</h1>
        <p>Introduce Yourself</p>
      </div>

      <!-- Right side input -->
      <div class="input-section">
        <input type="text" id="nameInput" class="form-control custom-input" placeholder="Enter your name" autocomplete="off">
      </div>

    </div>

    <!-- Bottom label -->
    <div class="footer-text">
      Knowledge Base App - v1.0
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
          crossorigin="anonymous"></script>

  <script>
    const loadingScreen = document.getElementById('loadingScreen');
    const mainApp = document.getElementById('mainApp');
    const musicWidget = document.getElementById('musicWidget');
    const nameInput = document.getElementById('nameInput');
    const welcomeHeading = document.getElementById('welcomeHeading');

    // Audio elements
    const bgMusic = document.getElementById('bgMusic');
    const musicToggleBtn = document.getElementById('musicToggleBtn');
    const musicIcon = document.getElementById('musicIcon');
    const musicText = document.getElementById('musicText');

    let isPlaying = false;

    // 1. Hold loading screen for exactly 3.5 seconds
    setTimeout(() => {
      loadingScreen.style.display = 'none'; // Hide loader
      mainApp.style.display = 'flex';        // Show main app
      musicWidget.style.display = 'block';   // Reveal music widget button
      nameInput.focus();                    // Focus input box immediately
    }, 3500);

    // 2. Dynamic live name typing updates
    nameInput.addEventListener('input', () => {
      const name = nameInput.value.trim();
      welcomeHeading.textContent = name ? `Welcome ${name}` : 'Welcome New User';
    });

    // 3. Music Toggle Logic
    musicToggleBtn.addEventListener('click', () => {
      if (!isPlaying) {
        bgMusic.play();
        musicIcon.textContent = '🔊';
        musicText.textContent = 'Pause Music';
        musicToggleBtn.style.borderColor = '#38edf6';
        isPlaying = true;
      } else {
        bgMusic.pause();
        musicIcon.textContent = '🎵';
        musicText.textContent = 'Play Study Music';
        musicToggleBtn.style.borderColor = 'rgba(255, 255, 255, 0.25)';
        isPlaying = false;
      }
    });
  </script>
</body>
</html>
