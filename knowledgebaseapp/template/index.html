<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knowledge Base App</title>
  
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

  <style>
    body {
      min-height: 100vh;
      background: radial-gradient(circle at 50% 50%, #0a58ca 0%, #031b4e 65%, #010a1c 100%);
      color: #ffffff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    .main-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 3rem 4rem;
    }

    .content-area {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-grow: 1;
      width: 100%;
    }

    /* Left Header Section */
    .header-section {
      max-width: 400px;
    }

    .header-section h1 {
      font-size: 2.8rem;
      font-weight: 600;
      letter-spacing: -0.5px;
      margin-bottom: 0.3rem;
      transition: all 0.2s ease;
    }

    .header-section p {
      color: #cbd5e1;
      font-size: 1.3rem;
      font-weight: 300;
    }

    /* Center Glow Spinner */
    .sync-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    .glow-spinner {
      width: 80px;
      height: 80px;
      border: 4px solid rgba(255, 255, 255, 0.15);
      border-top: 4px solid #38edf6;
      border-right: 4px solid #0d6efd;
      border-radius: 50%;
      animation: spin 1.2s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
      box-shadow: 0 0 30px rgba(56, 237, 246, 0.35);
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .sync-text {
      margin-top: 1.5rem;
      font-size: 0.95rem;
      color: #94a3b8;
      letter-spacing: 0.5px;
      transition: color 0.3s ease;
    }

    /* Right Input Section */
    .input-section {
      width: 280px;
    }

    .custom-input {
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      font-size: 1rem;
      color: #1e293b;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      transition: all 0.3s ease;
    }

    .custom-input:focus {
      outline: none;
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(56, 237, 246, 0.4), 0 10px 25px rgba(0, 0, 0, 0.4);
      border-color: #38edf6;
    }

    /* Bottom Branding */
    .footer-text {
      text-align: center;
      font-size: 0.75rem;
      letter-spacing: 2px;
      color: #64748b;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div class="main-wrapper">
    <!-- Main Content Row -->
    <div class="content-area">
      
      <!-- Left: Header -->
      <div class="header-section">
        <h1 id="welcomeHeading">Welcome New User</h1>
        <p>Introduce Yourself</p>
      </div>

      <!-- Center: Synchronizing Loader -->
      <div class="sync-section" id="syncSection">
        <div class="glow-spinner"></div>
        <div class="sync-text" id="syncText">Retrieving user data...</div>
      </div>

      <!-- Right: Input -->
      <div class="input-section">
        <input type="text" id="nameInput" class="form-control custom-input" placeholder="Enter your name" autocomplete="off">
      </div>

    </div>

    <!-- Footer -->
    <div class="footer-text">
      Knowledge Base App - v1.0
    </div>
  </div>

  <!-- Bootstrap Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
          crossorigin="anonymous"></script>

  <script>
    const nameInput = document.getElementById('nameInput');
    const welcomeHeading = document.getElementById('welcomeHeading');
    const syncSection = document.getElementById('syncSection');
    const syncText = document.getElementById('syncText');

    // 1. Dynamic typing updates the heading
    nameInput.addEventListener('input', () => {
      const name = nameInput.value.trim();
      welcomeHeading.textContent = name ? `Welcome ${name}` : 'Welcome New User';
    });

    // 2. Automatically complete synchronization after 3.5 seconds
    setTimeout(() => {
      syncText.textContent = "System Ready!";
      syncText.style.color = "#38edf6";
      
      // Gently fade out loader
      setTimeout(() => {
        syncSection.style.opacity = "0";
        syncSection.style.transform = "scale(0.85)";
      }, 800);
    }, 3500);
  </script>
</body>
</html>
